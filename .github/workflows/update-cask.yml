name: Auto Update Cask

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [update-cask]

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Check latest Voxa release and update Cask
        run: |
          set -e
          echo "Fetching latest release from ArnavBallinCode/voxa..."
          RELEASE_JSON=$(curl -sSL -H "Accept: application/vnd.github+json" https://api.github.com/repos/ArnavBallinCode/voxa/releases | jq 'map(select(.draft == false)) | .[0]')
          
          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          VERSION="${TAG_NAME#v}"
          
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "No valid release found. Exiting."
            exit 0
          fi
          
          echo "Latest release version: $VERSION"
          
          CURRENT_VERSION=$(grep -E 'version "' Casks/voxa.rb | head -n1 | sed -E 's/.*version "([^"]+)".*//')
          echo "Current cask version: $CURRENT_VERSION"
          
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("Voxa_.*_aarch64\.dmg$")) | .browser_download_url')
          
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No aarch64 DMG asset found in release $TAG_NAME. Exiting."
            exit 0
          fi
          
          echo "Downloading DMG to compute SHA256: $ASSET_URL"
          curl -sSL "$ASSET_URL" -o /tmp/voxa.dmg
          SHA256=$(sha256sum /tmp/voxa.dmg | awk '{print $1}')
          rm -f /tmp/voxa.dmg
          
          echo "Calculated SHA256: $SHA256"
          
          CURRENT_SHA=$(grep -E 'sha256 "' Casks/voxa.rb | head -n1 | sed -E 's/.*sha256 "([^"]+)".*//')
          
          if [ "$CURRENT_VERSION" = "$VERSION" ] && [ "$CURRENT_SHA" = "$SHA256" ]; then
            echo "Cask is already up to date ($VERSION). Nothing to commit."
            exit 0
          fi
          
          echo "Updating Casks/voxa.rb to version $VERSION..."
          
          cat <<EOF > Casks/voxa.rb
cask "voxa" do
  version "$VERSION"
  sha256 "$SHA256"

  url "https://github.com/ArnavBallinCode/voxa/releases/download/v#{version}/Voxa_#{version}_aarch64.dmg"
  name "Voxa"
  desc "On-device AI meeting and interpretation console (VoxBento Local)"
  homepage "https://voxbento.org/local"

  auto_updates false
  depends_on macos: :sonoma

  app "Voxa.app"

  postflight do
    system_command "/usr/bin/xattr",
                   args: ["-cr", "#{appdir}/Voxa.app"]
  end

  zap trash: [
    "~/Library/Application Support/com.arnav.voxa",
    "~/Library/Caches/com.arnav.voxa",
    "~/Library/Preferences/com.arnav.voxa.plist",
    "~/Library/Saved Application State/com.arnav.voxa.savedState",
  ]
end
EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/voxa.rb
          git commit -m "chore: bump voxa cask to v$VERSION [skip ci]"
          git push
          echo "Successfully updated Casks/voxa.rb to v$VERSION!"
